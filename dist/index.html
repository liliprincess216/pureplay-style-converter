<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0ea" />
    <title>纯玩照片生成器</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%23111111%22/><path d=%22M14 18h36v7H14zm0 11h25v7H14zm0 11h31v7H14z%22 fill=%22%23f4eee5%22/></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <button id="emptyScreen" class="empty-screen" type="button" aria-label="选择一张照片">
        <span class="empty-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="empty-copy">
          <strong>请上传图片</strong>
          <small>点击屏幕任意位置</small>
        </span>
        <span class="empty-index">01—02</span>
      </button>

      <section id="swipeViewport" class="swipe-viewport" hidden>
        <div id="pageTrack" class="page-track">
          <article class="page page-original" aria-label="原始照片页面">
            <canvas id="originalCanvas" width="960" height="1280"></canvas>
            <div id="statusCapsule" class="status-capsule is-loading">
              <span class="status-dot"></span>
              <span id="statusText">生成中，请稍等</span>
            </div>
            <span class="page-index">01 / 02</span>
          </article>

          <article class="page page-result" aria-label="纯玩照片结果页面">
            <canvas id="resultCanvas" width="960" height="1280"></canvas>
            <span class="page-index">02 / 02</span>
            <button id="downloadButton" class="download-button" type="button">
              <span>下载 3:4 图片</span>
              <b aria-hidden="true">↓</b>
            </button>
          </article>
        </div>

        <canvas id="bandCanvas" class="transition-layer" width="960" height="1280" aria-hidden="true"></canvas>
        <div id="gestureHint" class="gesture-hint" aria-hidden="true">
          <span>左滑查看</span><i>←</i>
        </div>
      </section>

      <input id="fileInput" type="file" accept="image/*" hidden />
      <div id="toast" class="toast" role="status"></div>
    </main>
    <script type="module" src="./app.js?v=5"></script>
  </body>
</html>
