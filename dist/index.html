<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="上传人物照片，生成专属纯玩风格图像。" />
    <title>纯玩照片生成器</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22white%22/><path d=%22M15 19h34M15 31h34M15 43h34%22 stroke=%22black%22 stroke-width=%226%22 stroke-linecap=%22round%22/></svg>" />
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body>
    <main id="app">
      <button id="emptyScreen" class="state-screen upload-screen" type="button" aria-label="上传含人物的照片">
        <span class="state-pill solid-pill">
          <strong>上传含人物的照片</strong>
          <strong>生成专属纯玩照片</strong>
        </span>
      </button>

      <section id="loadingScreen" class="state-screen overlay-screen" aria-label="正在生成纯玩照片" hidden>
        <div class="state-pill dashed-pill" aria-hidden="true">
          <strong>纯玩</strong>
          <strong>纯玩</strong>
          <strong>纯玩</strong>
        </div>
      </section>

      <section id="readyScreen" class="state-screen overlay-screen ready-screen" aria-label="生成完毕，左滑查看" hidden>
        <span class="gesture-arrow top-arrow" aria-hidden="true">←</span>
        <div class="state-pill solid-pill">
          <strong>生成完毕</strong>
          <strong>左滑查看</strong>
        </div>
        <span class="gesture-arrow bottom-arrow" aria-hidden="true">←</span>
      </section>

      <section id="swipeViewport" class="swipe-viewport" hidden aria-label="原图与纯玩结果">
        <div id="pageTrack" class="page-track">
          <article class="page" aria-label="原始照片">
            <canvas id="originalCanvas" width="960" height="1280"></canvas>
          </article>
          <article class="page" aria-label="纯玩照片结果">
            <canvas id="resultCanvas" width="960" height="1280"></canvas>
          </article>
        </div>
        <canvas id="bandCanvas" class="transition-layer" width="960" height="1280" aria-hidden="true"></canvas>
      </section>

      <input id="fileInput" type="file" accept="image/*" hidden />
      <div id="toast" class="toast" role="status"></div>
    </main>
    <script type="module" src="./app.js?v=7"></script>
  </body>
</html>
